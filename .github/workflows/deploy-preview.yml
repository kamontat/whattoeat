name: Deploy Preview

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    ## NOTE: The template repository itself has no Worker to deploy; repositories created from it are not templates
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      ## NOTE: The deployment-url output didn't support alias url so we built it manually
      ## https://github.com/cloudflare/wrangler-action/blob/a17640ae5ec0d99c8c75e908aa69f5519037cd4e/src/commandOutputParsing.ts#L118
      url: https://pr-${{ github.event.number }}-whattoeat.kcinth.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      - run: echo "BUN_PUBLIC_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        id: deploy
        ## NOTE: wrangler runs `bun run build` itself, so the build reads these from the step environment.
        ##       The pull request head, not the merge commit GitHub checks out, is the commit worth linking.
        env:
          BUN_PUBLIC_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          BUN_PUBLIC_BRANCH: ${{ github.event.pull_request.head.ref }}
          BUN_PUBLIC_PR_NUMBER: ${{ github.event.number }}
        with:
          command: versions upload --preview-alias pr-${{ github.event.number }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
