name: Deploy Production

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    ## NOTE: The template repository itself has no Worker to deploy; repositories created from it are not templates
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      ## NOTE: The deployment-url output didn't support custom domain so we built it manually
      url: https://<TODO>.kc.in.th
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        id: deploy
        ## NOTE: wrangler runs `bun run build` itself, so the build reads this from the step environment.
        ##       Unset (no GTM_ID repository variable) leaves Google Tag Manager off.
        env:
          BUN_PUBLIC_GTM_ID: ${{ vars.GTM_ID }}
        with:
          command: deploy
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
